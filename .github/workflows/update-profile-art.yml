name: Update profile art

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'profile.json'
      - '.github/workflows/update-profile-art.yml'

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test calendar handling
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Fetch real contributions
        run: python scripts/fetch_contributions.py
      - name: Render profile cards
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/make_info_card.py
      - name: Commit changed artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/contributions.json contrib-heatmap.svg info-card.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh profile art [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
