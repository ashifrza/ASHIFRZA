<svg xmlns="http://www.w3.org/2000/svg" width="960" height="285" viewBox="0 0 960 285" role="img" aria-labelledby="title desc">
<title id="title">From interface to intelligence</title><desc id="desc">Frontend: React, Next.js, TypeScript. Backend: Node.js, Express, Flask. Data: MongoDB, MySQL and AI APIs. Projects include AI stock prediction and image generation and classification.</desc>
<style>
    @keyframes arrive{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes scan{0%,100%{transform:translateY(0);opacity:0}12%,80%{opacity:.8}90%{transform:translateY(286px);opacity:0}}
    @keyframes packet{0%{stroke-dashoffset:180;opacity:0}12%,80%{opacity:1}100%{stroke-dashoffset:-320;opacity:0}}
    @keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
    .enter{animation:arrive .8s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d,0s)}
    .orbit{transform-origin:744px 229px;animation:orbit 38s linear infinite}
    .orbit-back{transform-origin:744px 229px;animation:orbit 54s linear infinite reverse}
    .scan{animation:scan 7s ease-in-out infinite}
    .packet{stroke-dasharray:30 500;animation:packet 5s linear infinite}
    .trace{stroke-dasharray:900;animation:draw 2.4s ease-out both}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.scan,.packet{display:none}.trace{stroke-dasharray:none}}
    </style>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#242831" stroke-width=".5"/></pattern><radialGradient id="halo"><stop stop-color="#343645" stop-opacity=".65"/><stop offset="1" stop-color="#0c0e13" stop-opacity="0"/></radialGradient></defs>
<rect width="960" height="285" rx="18" fill="#0c0e13"/>
<rect x=".5" y=".5" width="959" height="284" rx="18" fill="none" stroke="#292d36"/>
<text x="32" y="35" font-family="Consolas,monospace" font-size="10" fill="#d8ff62" >02 / THE BUILD SYSTEM</text>
<text x="32" y="76" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#f0efe8" font-weight="bold" letter-spacing="-.5">From interface to intelligence.</text>
<text x="928" y="35" font-family="Consolas,monospace" font-size="9" fill="#999da7" text-anchor="end">ONE DEVELOPER. THE WHOLE STACK.</text>
<g class="enter" style="--d:0.0s">
<rect x="32" y="104" width="266" height="119" rx="9" fill="#12151c" stroke="#292d36"/>
<text x="49" y="130" font-family="Consolas,monospace" font-size="10" fill="#a79bff" >01</text>
<text x="80" y="130" font-family="Consolas,monospace" font-size="11" fill="#d8ff62" >INTERFACE</text>
<text x="49" y="166" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#f0efe8" >React / Next.js</text>
<text x="49" y="194" font-family="Consolas,monospace" font-size="11" fill="#999da7" >TypeScript / Tailwind</text>
</g>
<path d="M298 164H347" stroke="#292d36" fill="none"/>
<path class="packet" d="M298 164H347" stroke="#d8ff62" stroke-width="2" fill="none" style="animation-delay:0.0s"/>
<g class="enter" style="--d:0.16s">
<rect x="347" y="104" width="266" height="119" rx="9" fill="#12151c" stroke="#292d36"/>
<text x="364" y="130" font-family="Consolas,monospace" font-size="10" fill="#a79bff" >02</text>
<text x="395" y="130" font-family="Consolas,monospace" font-size="11" fill="#d8ff62" >ENGINE</text>
<text x="364" y="166" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#f0efe8" >Node.js / Express</text>
<text x="364" y="194" font-family="Consolas,monospace" font-size="11" fill="#999da7" >Flask / REST APIs</text>
</g>
<path d="M613 164H662" stroke="#292d36" fill="none"/>
<path class="packet" d="M613 164H662" stroke="#d8ff62" stroke-width="2" fill="none" style="animation-delay:0.6s"/>
<g class="enter" style="--d:0.32s">
<rect x="662" y="104" width="266" height="119" rx="9" fill="#12151c" stroke="#292d36"/>
<text x="679" y="130" font-family="Consolas,monospace" font-size="10" fill="#a79bff" >03</text>
<text x="710" y="130" font-family="Consolas,monospace" font-size="11" fill="#d8ff62" >INTELLIGENCE</text>
<text x="679" y="166" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#f0efe8" >MongoDB / MySQL</text>
<text x="679" y="194" font-family="Consolas,monospace" font-size="11" fill="#999da7" >AI APIs / Python</text>
</g>
<text x="32" y="259" font-family="Consolas,monospace" font-size="10" fill="#a79bff" >BUILT:</text>
<text x="89" y="259" font-family="Consolas,monospace" font-size="11" fill="#999da7" >AI stock prediction</text>
<text x="371" y="259" font-family="Consolas,monospace" font-size="11" fill="#999da7" >Image generation + classification</text>
</svg>
