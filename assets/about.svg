<svg xmlns="http://www.w3.org/2000/svg" width="960" height="266" viewBox="0 0 960 266" role="img"><title>About Ashif: fullstack developer, former frontend intern at Syntechxhub, mathematics graduate. Current focus is HireEdge.</title><style>@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes tilt{0%,100%{transform:translate(0,0) rotate(-2deg) scale(.99)}50%{transform:translate(-4px,-7px) rotate(2deg) scale(1.015)}}@keyframes sheen{0%,15%{transform:translateX(-450px);opacity:0}35%,55%{opacity:.7}80%,100%{transform:translateX(1100px);opacity:0}}@keyframes flow{to{stroke-dashoffset:-100}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.8}}.enter{animation:in .9s ease-out both;animation-delay:var(--d,0s)}.portrait{transform-origin:751px 239px;animation:tilt 9s ease-in-out infinite}.sheen{animation:sheen 12s ease-in-out infinite;pointer-events:none}.flow{stroke-dasharray:5 12;animation:flow 5s linear infinite}.pulse{animation:pulse 6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}.sheen{display:none}}</style>
