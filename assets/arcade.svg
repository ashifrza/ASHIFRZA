<text x="30" y="107" font-family="Arial,Helvetica,sans-serif" font-size="47" fill="#edf5ff" font-weight="900" letter-spacing="-2">COMMIT DASH</text>
<text x="30" y="145" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#98abc6" >Ship commits. Dodge bugs. Keep the build alive.</text>
<rect x="30" y="175" width="208" height="46" rx="8" fill="#62e7ff"/>
