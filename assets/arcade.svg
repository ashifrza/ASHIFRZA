<svg xmlns="http://www.w3.org/2000/svg" width="960" height="242" viewBox="0 0 960 242" role="img"><title>Play Commit Dash. A 45-second runner with keyboard and touch controls. Opens the existing game on a separate page.</title><style>@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes tilt{0%,100%{transform:translate(0,0) rotate(-2deg) scale(.99)}50%{transform:translate(-4px,-7px) rotate(2deg) scale(1.015)}}@keyframes sheen{0%,15%{transform:translateX(-450px);opacity:0}35%,55%{opacity:.7}80%,100%{transform:translateX(1100px);opacity:0}}@keyframes flow{to{stroke-dashoffset:-100}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.8}}.enter{animation:in .9s ease-out both;animation-delay:var(--d,0s)}.portrait{transform-origin:751px 239px;animation:tilt 9s ease-in-out infinite}.sheen{animation:sheen 12s ease-in-out infinite;pointer-events:none}.flow{stroke-dasharray:5 12;animation:flow 5s linear infinite}.pulse{animation:pulse 6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}.sheen{display:none}}</style>
<defs><linearGradient id="surface" x2="1" y2="1"><stop stop-color="#303b33"/><stop offset=".5" stop-color="#1b221e"/><stop offset="1" stop-color="#20201d"/></linearGradient><linearGradient id="edge" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".38"/><stop offset=".4" stop-color="#d3ddc9" stop-opacity=".05"/><stop offset="1" stop-color="#d3ddc9" stop-opacity=".22"/></linearGradient><linearGradient id="glass" x2=".7" y2="1"><stop stop-color="#ffffff" stop-opacity=".11"/><stop offset="1" stop-color="#ffffff" stop-opacity=".025"/></linearGradient><linearGradient id="shine"><stop stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".12"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient><radialGradient id="warm"><stop stop-color="#bf5d37" stop-opacity=".22"/><stop offset="1" stop-color="#bf5d37" stop-opacity="0"/></radialGradient><radialGradient id="sage"><stop stop-color="#9abca5" stop-opacity=".14"/><stop offset="1" stop-color="#9abca5" stop-opacity="0"/></radialGradient></defs>
<defs><clipPath id="panel"><rect x="1" y="1" width="958" height="240" rx="26"/></clipPath></defs>
<rect x=".5" y=".5" width="959" height="241" rx="26" fill="url(#surface)" stroke="url(#edge)"/>
<g clip-path="url(#panel)"><ellipse cx="902.4" cy="31.46" rx="576.0" ry="217.8" fill="url(#warm)"/><ellipse cx="0" cy="242" rx="528.0" ry="242" fill="url(#sage)"/></g>
<text x="30" y="32" font-family="Consolas,monospace" font-size="10" fill="#ed9d79" >06</text>
<text x="65" y="32" font-family="Consolas,monospace" font-size="10" fill="#b0b0a4" >A SMALL DISTRACTION</text>
<path d="M30 47H930" stroke="#444940"/>
<text x="30" y="112" font-family="Georgia,serif" font-size="38" fill="#f3eee2" font-style="italic">All work? No thanks.</text>
<text x="30" y="152" font-family="Consolas,monospace" font-size="14" fill="#b0b0a4" >Collect commits. Dodge bugs. Beat your best.</text>
<text x="30" y="213" font-family="Consolas,monospace" font-size="9" fill="#afc4af" >COMMIT DASH / 45 SECONDS / KEYBOARD + TOUCH</text>
<rect x="631" y="83" width="267" height="86" rx="25" fill="url(#glass)" stroke="url(#edge)"/>
<text x="665" y="135" font-family="Consolas,monospace" font-size="17" fill="#f4f2e8" font-weight="bold">PLAY A ROUND</text>
<text x="869" y="138" font-family="Consolas,monospace" font-size="29" fill="#f4f2e8" text-anchor="end">↗</text>
<path class="flow" d="M632 196H899" stroke="#ed9d79" stroke-width="2"/>
</svg>
