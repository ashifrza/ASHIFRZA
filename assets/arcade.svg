<svg xmlns="http://www.w3.org/2000/svg" width="960" height="242" viewBox="0 0 960 242" role="img"><title>Play Commit Dash. A 45-second runner with keyboard and touch controls. Opens the existing game on a separate page.</title><style>@keyframes spin{to{transform:rotate(360deg)}}.spin{transform-origin:770px 194px;animation:spin 32s linear infinite}@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes flow{to{stroke-dashoffset:-100}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}.enter{animation:in .8s ease-out both;animation-delay:var(--d,0s)}.float{animation:hover 6s ease-in-out infinite;animation-delay:var(--d,0s)}.flow{stroke-dasharray:5 12;animation:flow 5s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x=".5" y=".5" width="959" height="241" rx="2" fill="#f4f2e8" stroke="#d5d5c8"/>
<text x="30" y="32" font-family="Consolas,monospace" font-size="10" fill="#c44928" >06</text>
<text x="65" y="32" font-family="Consolas,monospace" font-size="10" fill="#686b61" >A SMALL DISTRACTION</text>
<path d="M30 47H930" stroke="#d5d5c8"/>
<text x="30" y="112" font-family="Georgia,serif" font-size="38" fill="#222622" font-style="italic">All work? No thanks.</text>
<text x="30" y="152" font-family="Consolas,monospace" font-size="14" fill="#686b61" >Collect commits. Dodge bugs. Beat your best.</text>
<text x="30" y="213" font-family="Consolas,monospace" font-size="9" fill="#437161" >COMMIT DASH / 45 SECONDS / KEYBOARD + TOUCH</text>
<rect x="631" y="83" width="267" height="86" fill="#222622"/>
<text x="665" y="135" font-family="Consolas,monospace" font-size="17" fill="#f4f2e8" font-weight="bold">PLAY A ROUND</text>
<text x="869" y="138" font-family="Consolas,monospace" font-size="29" fill="#f4f2e8" text-anchor="end">↗</text>
<path class="flow" d="M632 196H899" stroke="#c44928" stroke-width="2"/>
</svg>
